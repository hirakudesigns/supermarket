<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おつかいアドベンチャー：スーパーへ行こう！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a2e;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #gameCanvas {
    background: #7ec8e3;
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.65);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    font-size: clamp(22px, 5vw, 36px);
    margin-bottom: 16px;
    text-shadow: 2px 2px 0 #ff6b6b;
  }
  #overlay p {
    font-size: clamp(13px, 3vw, 16px);
    line-height: 1.7;
    margin-bottom: 20px;
    max-width: 420px;
  }
  #overlay button {
    font-size: clamp(16px, 4vw, 20px);
    padding: 12px 32px;
    border-radius: 30px;
    border: none;
    background: #ff6b6b;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #c44545;
    transition: transform 0.1s;
  }
  #overlay button:active { transform: translateY(4px); box-shadow: 0 0 0 #c44545; }
  .hidden { display: none !important; }

  #touchControls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 16px;
    pointer-events: none;
  }
  .touchBtn {
    pointer-events: auto;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    color: #fff;
    font-weight: bold;
  }
  #dpad { display: flex; gap: 10px; }
  #jumpBtn { width: 76px; height: 76px; font-size: 15px; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div id="overlay">
    <h1>🏠 おつかいアドベンチャー 🏪</h1>
    <p>
      自宅からスーパーまでの道のりを進もう！<br>
      ← → で移動、スペース/↑でジャンプ。<br>
      障害物をよけて、コインを集めながらゴールを目指そう。<br>
      （キャラや背景は後でドット絵に差し替え予定のプレースホルダーです）
    </p>
    <button id="startBtn">スタート</button>
  </div>

  <div id="touchControls" class="hidden">
    <div id="dpad">
      <div class="touchBtn" id="leftBtn">◀</div>
      <div class="touchBtn" id="rightBtn">▶</div>
    </div>
    <div class="touchBtn" id="jumpBtn">JUMP</div>
  </div>
</div>

const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const touchControls = document.getElementById('touchControls');

const GROUND_Y = 330;
const WORLD_WIDTH = 6400;
const CANVAS_W = canvas.width;
const CANVAS_H = canvas.height;

// ============ 背景要素の生成（プレースホルダー：単色図形） ============
const VISUAL_SCALE = 1.5; // 見た目の大きさ調整用（建物・木・キャラなど）
// 遠景の建物（家並み）
const buildings = [];
for (let i = 0; i < 30; i++) {
  buildings.push({
    x: i * 260 * VISUAL_SCALE + Math.random() * 80,
    w: (90 + Math.random() * 60) * VISUAL_SCALE,
    h: (60 + Math.random() * 90) * VISUAL_SCALE,
    color: ['#8aa4c9', '#9fb4d1', '#7d93b8'][i % 3]
  });
}
// 雲
const clouds = [];
for (let i = 0; i < 14; i++) {
  clouds.push({ x: i * 480 + Math.random() * 200, y: 30 + Math.random() * 70, s: (0.7 + Math.random() * 0.8) * VISUAL_SCALE });
}
// 街路樹
const trees = [];
for (let i = 0; i < 40; i++) {
  trees.push({ x: 180 + i * 150 * VISUAL_SCALE + Math.random() * 40 });
}

// ============ 障害物（プレースホルダー：カラーブロック） ============
// type: 'cone'（三角コーン）, 'box'（配達ボックス）
const obstacles = [];
function makeObstacles() {
  const types = ['cone', 'box'];
  let x = 500;
  while (x < WORLD_WIDTH - 400) {
    const type = types[Math.floor(Math.random() * types.length)];
    obstacles.push({ x, type, hit: false });
    x += 380 + Math.random() * 260;
  }
}
makeObstacles();

// ============ コイン ============
const coins = [];
function makeCoins() {
  let x = 300;
  while (x < WORLD_WIDTH - 300) {
    const groupCount = 3 + Math.floor(Math.random() * 3);
    const baseY = GROUND_Y - 60 - Math.random() * 70;
    for (let i = 0; i < groupCount; i++) {
      coins.push({ x: x + i * 34, y: baseY, taken: false, bob: Math.random() * Math.PI * 2 });
    }
    x += 500 + Math.random() * 300;
  }
}
makeCoins();

// ============ 犬（追いかけギミック） ============
// 特定エリアに入ると背後から犬が追いかけてくる
const DOG_CHASE_SPEED = MOVE_SPEED * 1.12;
const dogZones = [
  { startX: 1300, endX: 2050, triggered: false },

// ============ カラス（右→左の一方通行フン爆撃ギミック） ============
// プレイヤーが近づくと画面右端から出現し、左へ飛び去りながら一度フンを落とす
const poops = [];
const crowZones = [];
function makeCrowZones() {
  let x = 700;
  while (x < WORLD_WIDTH - 400) {
    crowZones.push({ triggerX: x, triggered: false });
    x += 550 + Math.random() * 350;
  }
}
makeCrowZones();

const CARS_PER_CYCLE = 2;

const YELLOW_DURATION = 40;
const crossings = [
  { x: 700, state: 'red', timer: 0, car: null, carSpawnTimer: 40, carsPassed: 0 },

];

// ============ 入力 ============
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp') { keys.jump = true; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'Space' || e.code === 'ArrowUp') keys.jump = false;
});

function bindTouch(el, onDown, onUp) {
  el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
  el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
  el.addEventListener('mousedown', onDown);
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
}
bindTouch(document.getElementById('leftBtn'), () => keys.left = true, () => keys.left = false);
bindTouch(document.getElementById('rightBtn'), () => keys.right = true, () => keys.right = false);
bindTouch(document.getElementById('jumpBtn'), () => keys.jump = true, () => keys.jump = false);

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  touchControls.classList.remove('hidden');
  resetGame();
  state = 'playing';
});

function resetGame() {
  score = 0; lives = 5; camX = 0; invincibleTimer = 0; gameTime = 0;
  player.x = 60; player.y = GROUND_Y - player.h; player.vx = 0; player.vy = 0;
  obstacles.forEach(o => o.hit = false);
  coins.forEach(c => c.taken = false);
  dogZones.forEach(z => z.triggered = false);
  activeDog = null;
  poops.length = 0;
  crowZones.forEach(z => z.triggered = false);
  activeCrows.length = 0;
  crossings.forEach(c => { c.state = 'red'; c.timer = 0; c.car = null; c.carSpawnTimer = 40 + Math.random() * 60; c.carsPassed = 0; });
}

// ============ 更新処理 ============
function update() {
  if (state !== 'playing') return;

  // 横移動
  if (keys.left) { player.vx = -MOVE_SPEED; player.facing = -1; }
  else if (keys.right) { player.vx = MOVE_SPEED; player.facing = 1; }
  else { player.vx = 0; }

  // ジャンプ
  if (keys.jump && player.onGround) {
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
  }

  // 物理
  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x > WORLD_WIDTH - player.w) player.x = WORLD_WIDTH - player.w;

  if (player.y + player.h >= GROUND_Y) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
  }

  if (player.vx !== 0) player.animTimer++;

  // カメラ追従
  camX = player.x - CANVAS_W / 3;
  if (camX < 0) camX = 0;
  if (camX > WORLD_WIDTH - CANVAS_W) camX = WORLD_WIDTH - CANVAS_W;

  if (invincibleTimer > 0) invincibleTimer--;

  // 障害物との当たり判定
  const pBox = { x: player.x + 9, y: player.y + 9, w: player.w - 18, h: player.h - 9 };
  obstacles.forEach(o => {
    if (o.hit) return;
    const CONE_DISPLAY = CONE_BASE_SIZE * VISUAL_SCALE; // コーンのスプライト表示サイズ
    const ow = o.type === 'cone' ? CONE_DISPLAY * CONE_CONTENT.wFrac : 36 * VISUAL_SCALE;
    const oh = o.type === 'cone' ? CONE_DISPLAY * CONE_CONTENT.hFrac : 38 * VISUAL_SCALE;
    const ox = o.type === 'cone' ? o.x - ow / 2 : o.x; // コーンは中心寄せ、配達ボックスは左寄せ
    const oy = GROUND_Y - oh;
    if (rectsOverlap(pBox, { x: ox, y: oy, w: ow, h: oh }) && invincibleTimer <= 0) {
      o.hit = true;
      lives--;
      invincibleTimer = 90;
      player.vy = -8;
      player.vx = -player.facing * 4;
      if (lives <= 0) state = 'gameover';
    }
  });

  // コイン収集
  coins.forEach(c => {
    if (c.taken) return;
    c.bob += 0.08;
    if (rectsOverlap(pBox, { x: c.x - 15, y: c.y - 15, w: 30, h: 30 })) {
      c.taken = true;
      score += 10;
    }
  });

  // 犬ゾーンの発動チェック
  dogZones.forEach(zone => {
    if (!zone.triggered && player.x >= zone.startX && player.x < zone.endX) {
      zone.triggered = true;
      const dogDisplay = DOG_BASE_SIZE * VISUAL_SCALE;
      const dogWFrac = (dogSprites.rightFrac[0] - dogSprites.leftFrac[0] + dogSprites.rightFrac[1] - dogSprites.leftFrac[1]) / 2;
      const dogHFrac = (dogSprites.bottomFrac[0] - dogSprites.topFrac[0] + dogSprites.bottomFrac[1] - dogSprites.topFrac[1]) / 2;
      const dogH = dogDisplay * dogHFrac;
      activeDog = { x: player.x - 160, y: GROUND_Y - dogH, w: dogDisplay * dogWFrac, h: dogH, zone };
    }
  });

  // 犬の追跡・当たり判定
  if (activeDog) {
    activeDog.x += DOG_CHASE_SPEED;
    const dogBox = { x: activeDog.x, y: activeDog.y, w: activeDog.w, h: activeDog.h };
    if (rectsOverlap(pBox, dogBox) && invincibleTimer <= 0) {
      lives--;
      invincibleTimer = 90;
      player.vx = player.facing * 6; // 驚いて前方へダッシュ
      activeDog.x -= 70; // 犬も一旦下がる
      if (lives <= 0) state = 'gameover';
    }
    // 画面右端を完全に走り抜けたら退場（当たった/かわしたに関わらず最後まで走らせる）
    if (activeDog.x - camX > CANVAS_W + 60) {
      activeDog = null;
    }
  }

  // カラスの出現（画面右端から左へ一方通行）
  gameTime += 1;
  crowZones.forEach(zone => {
    const distFromRightEdge = zone.triggerX - (camX + CANVAS_W);
    if (!zone.triggered && distFromRightEdge < 30 && distFromRightEdge > -150) {
      zone.triggered = true;
      activeCrows.push({
        screenX: CANVAS_W + 30,
        y: GROUND_Y - 150 - Math.random() * 60,
        speed: 3.2 + Math.random() * 1.4,
        dropAtScreenX: 120 + Math.random() * 400,
        dropped: false
      });
    }
  });

  // カラスの移動・フン投下
  for (let i = activeCrows.length - 1; i >= 0; i--) {
    const c = activeCrows[i];
    c.screenX -= c.speed;
    if (!c.dropped && c.screenX <= c.dropAtScreenX) {
      poops.push({ x: c.screenX + camX, y: c.y + 10, vy: 2 });
      c.dropped = true;
    }
    if (c.screenX < -40) activeCrows.splice(i, 1);
  }

  // フンの落下・当たり判定
  for (let i = poops.length - 1; i >= 0; i--) {
    const p = poops[i];
    p.vy += 0.15;
    p.y += p.vy;
    const poopBox = { x: p.x - 7.5, y: p.y - 7.5, w: 15, h: 15 };
    if (invincibleTimer <= 0 && rectsOverlap(pBox, poopBox)) {
      lives--;
      invincibleTimer = 90;
      poops.splice(i, 1);
      if (lives <= 0) state = 'gameover';
      continue;
    }
    if (p.y > GROUND_Y) {
      poops.splice(i, 1);
    }
  }

  // 信号機＋横断してくる車の更新（2台通過するごとに黄→青1.5秒）
  const CAR_FIXED_Y = GROUND_Y - 15; // 交差点＝車が現れる固定位置
  const CROSSING_FAR_SCALE = 0.35;
  const CROSSING_NEAR_SCALE = 2.4;
  crossings.forEach(cr => {
    if (cr.state === 'red') {
      if (!cr.car) {
        if (cr.carsPassed >= CARS_PER_CYCLE) {
          // 2台通過し終えたので黄色を経て青信号へ
          cr.state = 'yellow';
          cr.timer = YELLOW_DURATION;
        } else {
          cr.carSpawnTimer--;
          if (cr.carSpawnTimer <= 0) {
            // dir 1: 小さく現れてだんだん拡大＝近づいてくる／ dir -1: 大きい状態から縮小＝去っていく
            const approaching = Math.random() < 0.6;
            cr.car = { t: 0, dir: approaching ? 1 : -1, speed: 0.006 + Math.random() * 0.003 };
          }
        }
      }
    } else if (cr.state === 'yellow') {
      cr.timer--;
      if (cr.timer <= 0) { cr.state = 'green'; cr.timer = GREEN_DURATION; }
    } else if (cr.state === 'green') {
      cr.timer--;
      if (cr.timer <= 0) {
        cr.state = 'red';
        cr.carsPassed = 0;
        cr.carSpawnTimer = 30 + Math.random() * 40;
      }
    }

    if (cr.car) {
      cr.car.t += cr.car.speed;
      // p: 0=遠く・小さい → 1=近く・大きい（位置は動かさずスケールだけ変化させる）
      const p = cr.car.dir === 1 ? cr.car.t : 1 - cr.car.t;
      cr.car.curY = CAR_FIXED_Y;
      cr.car.curScale = CROSSING_FAR_SCALE + (CROSSING_NEAR_SCALE - CROSSING_FAR_SCALE) * p;
      const carDrawSize = CAR_BASE_SIZE * VISUAL_SCALE * cr.car.curScale;
      const cw = carDrawSize * CAR_CONTENT.wFrac, ch = carDrawSize * CAR_CONTENT.hFrac;
      const carBox = { x: cr.x - cw / 2, y: cr.car.curY - ch / 2, w: cw, h: ch };
      if (invincibleTimer <= 0 && rectsOverlap(pBox, carBox)) {
        lives--;
        invincibleTimer = 90;
        player.vx = -player.facing * 6;
        cr.car = null;
        cr.carsPassed++;
        cr.carSpawnTimer = 40 + Math.random() * 40;
        if (lives <= 0) state = 'gameover';
      } else if (cr.car && cr.car.t >= 1) {
        cr.car = null;
        cr.carsPassed++;
        cr.carSpawnTimer = 40 + Math.random() * 40;
      }
    }
  });

  // ゴール判定
  if (player.x + player.w >= GOAL_X) {
    state = 'cleared';
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ============ 描画処理 ============
function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // 空
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, '#7ec8e3');
  grad.addColorStop(1, '#cdeaf5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CANVAS_W, GROUND_Y);

  // 太陽
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(CANVAS_W - 80, 60, 30, 0, Math.PI * 2);
  ctx.fill();

  // 雲（遠景・低速スクロール）
  clouds.forEach(c => {
    const sx = c.x - camX * 0.3;
    if (sx < -100 || sx > CANVAS_W + 100) return;
    drawCloud(sx, c.y, c.s);
  });

  // 建物（中景・中速スクロール）
  buildings.forEach(b => {
    const sx = b.x - camX * 0.55;
    if (sx < -150 || sx > CANVAS_W + 150) return;
    ctx.fillStyle = b.color;
    ctx.fillRect(sx, GROUND_Y - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let wy = 0; wy < b.h - 20; wy += 24) {
      for (let wx = 10; wx < b.w - 15; wx += 22) {
        ctx.fillRect(sx + wx, GROUND_Y - b.h + wy + 10, 10, 12);
      }
    }
  });

  // 地面（ドット絵を天地合わせでタイリング）
  if (envSprites.loaded >= ENV_SPRITES_TOTAL) {
    const tileH = CANVAS_H - GROUND_Y; // 地面部分の高さに合わせる
    const tileW = tileH; // 元画像が正方形なので幅も同じ比率に
    const startTile = Math.floor(camX / tileW);
    const offsetX = camX - startTile * tileW;
    for (let sx = -offsetX; sx < CANVAS_W; sx += tileW) {
      ctx.drawImage(envSprites.ground, sx, GROUND_Y, tileW, tileH);
    }
  } else {
    ctx.fillStyle = '#c9a876';
    ctx.fillRect(0, GROUND_Y, CANVAS_W, CANVAS_H - GROUND_Y);
  }

  // 街路樹（近景）
  const TREE_SIZE = 130; // 木の表示サイズ（正方形）
  trees.forEach(t => {
    const sx = t.x - camX;
    if (sx < -TREE_SIZE || sx > CANVAS_W + TREE_SIZE) return;
    if (envSprites.loaded >= ENV_SPRITES_TOTAL) {
      ctx.drawImage(envSprites.tree, sx - TREE_SIZE / 2, GROUND_Y - TREE_SIZE, TREE_SIZE, TREE_SIZE);
    } else {
      ctx.fillStyle = '#6b4a2f';
      ctx.fillRect(sx - 6, GROUND_Y - 51, 12, 51);
      ctx.fillStyle = '#5fa851';
      ctx.beginPath();
      ctx.arc(sx, GROUND_Y - 66, 30, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // スタート地点：自宅（プレースホルダー）
  drawHouse(120 - camX, GROUND_Y);

  // ゴール地点：スーパー（プレースホルダー）
  drawSupermarket(GOAL_X - camX, GROUND_Y);

  // 障害物
  obstacles.forEach(o => {
    if (o.hit) return;
    const sx = o.x - camX;
    if (sx < -60 || sx > CANVAS_W + 60) return;
    drawObstacle(sx, o.type);
  });

  // 信号機と横断してくる車
  crossings.forEach(cr => {
    const sx = cr.x - camX;
    if (sx < -80 || sx > CANVAS_W + 80) return;
    drawTrafficLight(sx - 34, cr.state);
    if (cr.car) drawCar(sx, cr.car.curY, cr.car.curScale, cr.car.dir);
  });

  // コイン
  coins.forEach(c => {
    if (c.taken) return;
    const sx = c.x - camX;
    if (sx < -30 || sx > CANVAS_W + 30) return;
    const by = Math.sin(c.bob) * 4;
    ctx.fillStyle = '#ffd43b';
    ctx.strokeStyle = '#e0a800';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, c.y + by, 13.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#e0a800';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('¥', sx, c.y + by + 5);
  });

  // カラス（右→左に一方通行で飛来）
  activeCrows.forEach(c => {
    drawCrow(c.screenX, c.y, gameTime, -1);
  });

  // フン
  poops.forEach(p => {
    const sx = p.x - camX;
    if (sx < -20 || sx > CANVAS_W + 20) return;
    drawPoop(sx, p.y);
  });

  // 犬（追いかけギミック）
  if (activeDog) {
    const sx = activeDog.x - camX;
    drawDog(sx, gameTime);
  }

  // プレイヤー
  if (invincibleTimer <= 0 || Math.floor(invincibleTimer / 5) % 2 === 0) {
    drawPlayer(player.x - camX, player.y);
  }

  drawHUD();

  if (state === 'cleared') drawEndScreen('🎉 スーパーに到着！', `獲得コイン：${score}`, '#4dabf7');
  if (state === 'gameover') drawEndScreen('😵 ゲームオーバー', 'もう一度挑戦しよう', '#ff6b6b');
}

function drawCloud(x, y, s) {
  const size = 90 * s;
  if (cloudLoaded) {
    ctx.drawImage(cloudSprite, x - size / 2, y - size / 2, size, size);
  } else {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.arc(18, -6, 12, 0, Math.PI * 2);
    ctx.arc(-16, -4, 11, 0, Math.PI * 2);
    ctx.arc(6, 4, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawHouse(x, groundY) {
  ctx.save();
  ctx.translate(x, groundY);
  ctx.scale(VISUAL_SCALE, VISUAL_SCALE);
  // 壁
  ctx.fillStyle = '#f0c987';
  ctx.fillRect(0, -90, 100, 90);
  // 屋根
  ctx.fillStyle = '#c05746';
  ctx.beginPath();
  ctx.moveTo(-12, -90);
  ctx.lineTo(50, -140);
  ctx.lineTo(112, -90);
  ctx.closePath();
  ctx.fill();
  // ドア
  ctx.fillStyle = '#6b4a2f';
  ctx.fillRect(38, -50, 26, 50);
  // 窓
  ctx.fillStyle = '#a8d8e8';
  ctx.fillRect(12, -70, 18, 18);
  ctx.fillRect(70, -70, 18, 18);
  ctx.fillStyle = '#333';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('自宅', 50, -100);
  ctx.restore();
}

function drawSupermarket(x, groundY) {
  ctx.save();
  ctx.translate(x, groundY);
  ctx.scale(VISUAL_SCALE, VISUAL_SCALE);
  ctx.fillStyle = '#5b9bd5';
  ctx.fillRect(0, -140, 200, 140);
  ctx.fillStyle = '#e8552f';
  ctx.fillRect(-10, -150, 220, 20);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SUPER', 100, -100);
  // 入口
  ctx.fillStyle = '#dfefff';
  ctx.fillRect(60, -60, 80, 60);
  ctx.strokeStyle = '#333';
  ctx.strokeRect(60, -60, 80, 60);
  ctx.beginPath();
  ctx.moveTo(100, -60);
  ctx.lineTo(100, 0);
  ctx.stroke();
  ctx.restore();
}

function drawObstacle(sx, type) {
  ctx.save();
  ctx.translate(sx, GROUND_Y);
  ctx.scale(VISUAL_SCALE, VISUAL_SCALE);
  if (type === 'cone') {
    if (coneLoaded) {
      const size = CONE_BASE_SIZE; // ローカル座標（外側のVISUAL_SCALE変換で最終サイズになる）
      ctx.drawImage(coneSprite, -size / 2, -size, size, size);
    } else {
      ctx.fillStyle = '#ff7b3d';
      ctx.beginPath();
      ctx.moveTo(18, -38);
      ctx.lineTo(0, 0);
      ctx.lineTo(36, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(6, -20, 24, 6);
    }
  } else if (type === 'box') {
    ctx.fillStyle = '#c8925a';
    ctx.fillRect(0, -38, 36, 38);
    ctx.strokeStyle = '#8a5f34';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, -38, 36, 38);
    ctx.beginPath();
    ctx.moveTo(0, -19);
    ctx.lineTo(36, -19);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCrow(x, y, t, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale((dir || 1) * VISUAL_SCALE, VISUAL_SCALE);
  const flap = Math.sin(t * 0.4) * 10;
  ctx.fillStyle = '#2b2b2b';
  // 胴体
  ctx.beginPath();
  ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // くちばし
  ctx.fillStyle = '#e8a33d';
  ctx.beginPath();
  ctx.moveTo(9, 0);
  ctx.lineTo(16, -2);
  ctx.lineTo(9, 3);
  ctx.closePath();
  ctx.fill();
  // 羽（ばたつき）
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath();
  ctx.moveTo(-4, 0);
  ctx.lineTo(-20, -flap);
  ctx.lineTo(-2, 4);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, 0);
  ctx.lineTo(20, -flap);
  ctx.lineTo(2, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTrafficLight(sx, state) {
  ctx.save();
  ctx.translate(sx, GROUND_Y);
  ctx.scale(VISUAL_SCALE, VISUAL_SCALE);
  // 支柱
  ctx.fillStyle = '#444';
  ctx.fillRect(-3, -120, 6, 120);
  // 信号ボックス
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-12, -158, 24, 54);
  const colors = {
    red: '#ff4d4d',
    yellow: '#ffd43b',
    green: '#51cf66'
  };
  const dim = 'rgba(255,255,255,0.15)';
  ['red', 'yellow', 'green'].forEach((c, i) => {
    ctx.fillStyle = state === c ? colors[c] : dim;
    ctx.beginPath();
    ctx.arc(0, -148 + i * 16, 6, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawCar(sx, y, scale, dir) {
  const drawSize = CAR_BASE_SIZE * VISUAL_SCALE * scale;
  if (carSprites.loaded >= CAR_SPRITES_TOTAL) {
    // dir 1: 近づいてくる（正面）／ dir -1: 去っていく（後ろ姿）
    const sprite = dir === 1 ? carSprites.front : carSprites.rear;
    const drawX = sx - drawSize * CAR_CONTENT.xFrac;
    const drawY = y - drawSize * CAR_CONTENT.yFrac;
    ctx.drawImage(sprite, drawX, drawY, drawSize, drawSize);
  } else {
    // 画像読み込み前の暫定表示
    ctx.save();
    ctx.translate(sx, y);
    ctx.scale(scale * VISUAL_SCALE, scale * VISUAL_SCALE);
    ctx.fillStyle = '#4d6fff';
    ctx.fillRect(-14, -22, 28, 44);
    ctx.fillStyle = dir === 1 ? '#fff59d' : '#ff6b6b';
    ctx.fillRect(-12, 19, 8, 3);
    ctx.fillRect(4, 19, 8, 3);
    ctx.restore();
  }
}


function drawPoop(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(VISUAL_SCALE, VISUAL_SCALE);
  ctx.fillStyle = '#8a6d3b';
  ctx.beginPath();
  ctx.ellipse(0, 4, 6, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -3, 4, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#6b5228';
  ctx.beginPath();
  ctx.arc(0, -7, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawDog(x, t) {
  const frameIndex = Math.floor(t / DOG_ANIM_INTERVAL) % 2;
  const size = DOG_BASE_SIZE * VISUAL_SCALE;
  if (dogSprites.loaded >= DOG_SPRITES_TOTAL) {
    const centerFrac = (dogSprites.leftFrac[frameIndex] + dogSprites.rightFrac[frameIndex]) / 2;
    const drawX = x - size * centerFrac;
    const drawY = GROUND_Y - size * dogSprites.bottomFrac[frameIndex];
    ctx.drawImage(dogSprites.frames[frameIndex], drawX, drawY, size, size);
  } else {
    // 画像読み込み前の暫定表示
    ctx.save();
    ctx.translate(x, GROUND_Y - 36);
    ctx.scale(VISUAL_SCALE, VISUAL_SCALE);
    const bob = Math.sin(t * 0.6) * 3;
    ctx.fillStyle = '#8a5a34';
    ctx.beginPath();
    ctx.ellipse(18, 14 + bob, 20, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(38, 8 + bob, 10, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // 「！」の警戒マーク
  ctx.fillStyle = '#ff6b6b';
  ctx.font = `bold ${16 * VISUAL_SCALE}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('!', x + size * 0.3, GROUND_Y - size - 6 + Math.sin(t * 0.6) * 3);
}

function drawPlayer(x, y) {
  ctx.save();
  const moving = player.onGround && player.vx !== 0;
  // 歩行アニメ：1→2→3→4→3→2 の順でコマ送り。止まっている時は静止カットを表示
  let sprite;
  if (moving) {
    const seqIndex = Math.floor(player.animTimer / WALK_ANIM_INTERVAL) % WALK_SEQUENCE.length;
    sprite = playerSprites.walk[WALK_SEQUENCE[seqIndex]];
  } else {
    sprite = playerSprites.idle;
  }
  const bob = moving ? Math.sin(player.animTimer * 0.3) * 2 : 0;

  if (playerSprites.loaded >= SPRITES_TOTAL) {
    ctx.translate(x + player.w / 2, y + bob + player.h / 2);
    if (player.facing === -1) ctx.scale(-1, 1); // 左向きは反転
    ctx.drawImage(sprite, -player.w / 2, -player.h / 2, player.w, player.h);
  } else {
    // 画像読み込み前の暫定表示
    ctx.fillStyle = '#4d7cff';
    ctx.fillRect(x, y + bob, player.w, player.h);
  }
  ctx.restore();
}

function drawHUD() {
  // コインスコア
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 110, 34);
  ctx.fillStyle = '#ffd43b';
  ctx.beginPath();
  ctx.arc(28, 27, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('x ' + score, 44, 32);

  // ライフ（大きめ・見やすく表示）
  const HEART_R = 13;
  const HEART_GAP = 32;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(CANVAS_W - 20 - 5 * HEART_GAP, 8, 5 * HEART_GAP + 12, 40);
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i < lives ? '#ff5c5c' : 'rgba(255,255,255,0.25)';
    ctx.strokeStyle = i < lives ? '#a11d1d' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    drawHeart(CANVAS_W - 20 - 5 * HEART_GAP + 16 + i * HEART_GAP, 28, HEART_R, true);
  }

  // 進行度バー
  const progress = Math.min(1, (player.x) / GOAL_X);
  const barW = 200;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(CANVAS_W / 2 - barW / 2, 12, barW, 12);
  ctx.fillStyle = '#69db7c';
  ctx.fillRect(CANVAS_W / 2 - barW / 2, 12, barW * progress, 12);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(CANVAS_W / 2 - barW / 2, 12, barW, 12);
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🏠 → 🏪', CANVAS_W / 2, 38);
}

function drawHeart(cx, cy, r, outline) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.6);
  ctx.bezierCurveTo(cx - r, cy - r * 0.4, cx - r * 0.4, cy - r, cx, cy - r * 0.2);
  ctx.bezierCurveTo(cx + r * 0.4, cy - r, cx + r, cy - r * 0.4, cx, cy + r * 0.6);
  ctx.closePath();
  ctx.fill();
  if (outline) ctx.stroke();
}

function drawEndScreen(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.fillStyle = color;
  ctx.font = 'bold 30px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, CANVAS_W / 2, CANVAS_H / 2 - 20);
  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.fillText(sub, CANVAS_W / 2, CANVAS_H / 2 + 14);
  ctx.font = '13px sans-serif';
  ctx.fillText('タップ / クリックでリトライ', CANVAS_W / 2, CANVAS_H / 2 + 44);
}

canvas.addEventListener('click', () => {
  if (state === 'cleared' || state === 'gameover') {
    resetGame();
    state = 'playing';
  }
});
canvas.addEventListener('touchstart', (e) => {
  if (state === 'cleared' || state === 'gameover') {
    e.preventDefault();
    resetGame();
    state = 'playing';
  }
});

// ============ メインループ ============
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
